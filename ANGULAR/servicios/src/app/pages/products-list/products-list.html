<!-- 
    A partir de la prop arrProductos mostramos un bloque HTML para cada producto
    @for 
    - CREAMOS ESTRUCTURA GENERICA PARA UN PRODUCTO
    - CREAMOS EL FOR ENVOLVIENDO ESA ESTRUCTURA 
-->



<section>
    
    <div class="btn">
        <button   (click)="onClick(true)">avanzar</button>
        {{page}}
        <button [disabled]="page === totalPages"  (click)="onClick(false)">atras</button>
    </div>
    
    @for (producto of arrProductos ; track producto._id) {
    <article>
    
        <h3>{{producto.name}}</h3>
        <img [src]="producto.image" alt="">
        <ul class="list-group">
    
            <li class="list-group-item">
                precio: {{producto.price | currency:'EUR'}}
            </li>
            <li class="list-group-item">
                categotia: {{producto.category}}
            </li>
    
        
        </ul>
    </article>

}
</section>
