<form [formGroup]="formulario" (ngSubmit)="onSubmit()">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" formControlName="nombre">
    </div>
    <div class="mb-3">
        <label class="form-label">Apellidos</label>
        <input type="text" class="form-control" formControlName="apellidos">
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email">
    </div>
    <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" class="form-control" formControlName="telefono">
    </div>
    <div class="mb-3">
        <label class="form-label">Departamento</label>
        <select class="form-select" formControlName="departamento">
            <option value="">Elige departamento</option>
            <option value="direccion">Dirección</option>
            <option value="recursoshumanos">Recursos Humanos</option>
            <option value="desarrollo">Desarrollo</option>
            <option value="diseño">Diseño</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Salario</label>
        <input type="number" class="form-control" formControlName="salario">
    </div>
    <input type="submit" value="Enviar" class="btn btn-info">

</form>
